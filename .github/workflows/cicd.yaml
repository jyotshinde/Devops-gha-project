name: Full CI/CD Pipeline
on: workflow_dispatch
  # push:
  #   branches:
  #     - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v3
     - name: Show repository structure
       run: ls -R
     - name: Setup JDK
       uses: actions/setup-java@v3
       with:
        java-version: '17'
        distribution: 'temurin'
     - name: Build with Maven
       working-directory: boardgame/
       run: mvn clean install

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Tests
        working-directory: boardgame/
        run: mvn test

  package-and-upload:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: boardgame/**/pom.xml
      - name: Package Application
        working-directory: boardgame/
        run: mvn package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-artifact
          path: boardgame/my-app/target/*.jar

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
      - name: Trivy File System Scan
        run: trivy fs . --format table

  sonarqube:
    runs-on: ubuntu-latest
    needs: test
    environment: main
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: SonarQube Cloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: boardgame
          args: >
            -Dsonar.projectKey=jyotshinde_Devops-gha-project
            -Dsonar.organization=jyotshinde
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          run: |
            mvn clean verify sonar:sonar \
             -Dsonar.projectKey=jyotshinde_Devops-gha-project \
             -Dsonar.organization=jyotshinde \
             -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
             -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install jq -y
      - name: Get Quality Gate Status
        id: quality_gate
        run: |
          response=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
          "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=github-actions")

          echo "response=$response" >> $GITHUB_OUTPUT

          status=$(echo "$response" | jq -r '.projectStatus.status')

          echo "quality_gate_status=$status" >> $GITHUB_OUTPUT
      - name: Check Quality Gate Status
        if: ${{ steps.quality_gate.outputs.quality_gate_status != 'OK' }}
        run: exit 1

  docker-build:
    runs-on: ubuntu-latest
    needs: sonarqube
    environment: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./boardgame
          file: ./boardgame/Dockerfile
          push: true
          tags: thejyot/my-app:latest
  docker-image-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
      - name: Scan Docker Image
        run: trivy image thejyot/my-app:latest

  kubernetes:
    runs-on: ubuntu-latest
    needs: docker-image-scan
    environment: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup kubeconfig
        uses: tale/kubeconfig-action@v1
        with:
          base64-kubeconfig: ${{ secrets.KUBECONFIG_BASE64 }}
      - name: Deploy to Kubernetes
        run: kubectl apply -f boardgame/deployment-service.yaml

